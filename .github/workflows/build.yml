name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import dsm; print(dsm.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pyinstaller packaging/dsm.spec --noconfirm

      - name: Smoke test (the app starts and imports everything)
        shell: bash
        run: |
          ./dist/SampleManager/SampleManager.exe &
          sleep 15
          tasklist | grep -i SampleManager
          taskkill //IM SampleManager.exe //F

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.v }}" packaging\installer.iss

      - name: Second copy under the old installer name
        # 0.8.1 (Deluge Sample Manager) looks for a DelugeSampleManager-Setup file; this copy lets it update itself
        # into Sample Manager. Keep until every PC has moved over.
        shell: bash
        run: cp "dist-installer/SampleManager-Setup-${{ steps.ver.outputs.v }}.exe" "dist-installer/DelugeSampleManager-Setup-${{ steps.ver.outputs.v }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist-installer/*.exe

  clean-pc:
    # 1.0: install the Setup .exe on a fresh Windows machine (no Python, nothing of ours) and run the installed app's
    # self-test (dsm/selftest.py). The release is only published when it passes.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\SampleManager-Setup-*.exe | Select-Object -First 1
          # Setup starts the app when it finishes (as the updater needs); -Wait would wait for that too, so wait
          # for Setup alone.
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(600000)) { throw "Setup didn't finish in 10 minutes" }
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          Get-Process SampleManager -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Self-test the installed app
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Sample Manager\SampleManager.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $dir = "$env:RUNNER_TEMP\selftest"
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; throw "Self-test didn't finish in 5 minutes" }
          Get-Content "$dir\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

  release:
    needs: [build, clean-pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist-installer
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-build${{ github.run_number }}
          name: Sample Manager ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          body_path: RELEASE_NOTES.txt
          files: dist-installer/*.exe
          make_latest: true
